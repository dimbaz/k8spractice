apiVersion: apps/v1
kind: Deployment
metadata:
    name: synergychat-crawler
    labels:
        app: synergychat-crawler
    namespace: crawler
spec:
    replicas: 1
    selector:
        matchLabels:
            app: synergychat-crawler
    template:
        metadata:
            labels:
                app: synergychat-crawler
        spec:
            containers:
                - name: synergychat-crawler-1
                  image: bootdotdev/synergychat-crawler:latest
                  envFrom:
                      - configMapRef:
                          name: synergychat-crawler-configmap
                  volumeMounts:
                      - name: cache-volume
                        mountPath: /cache
                - name: synergychat-crawler-2
                  image: bootdotdev/synergychat-crawler:latest
                  env:
                      - name: CRAWLER_PORT
                        value: "8082"
                      - name: CRAWLER_KEYWORDS
                        value: love,hate,joy,sadness,anger,disgust,fear,surprise
                      - name: CRAWLER_DB_PATH
                        value: /cache/db
                  volumeMounts:
                      - name: cache-volume
                        mountPath: /cache
                - name: synergychat-crawler-3
                  image: bootdotdev/synergychat-crawler:latest
                  env:
                      - name: CRAWLER_PORT
                        value: "8083"
                      - name: CRAWLER_KEYWORDS
                        value: love,hate,joy,sadness,anger,disgust,fear,surprise
                      - name: CRAWLER_DB_PATH
                        value: /cache/db
                  volumeMounts:
                      - name: cache-volume
                        mountPath: /cache
            volumes:
                - name: cache-volume
                  emptyDir: {}
